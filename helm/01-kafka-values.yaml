# still learning helm, so keeping notes here as I figure out what each override actually does

# kafka broker configuration, used with the bitnami/kafka chart
# learned this file does not stand on its own, its just an overrides file, helm takes the chart's
# own default values.yaml and layers whatever I put in here right on top of it
# e.g. helm install kafka bitnami/kafka -f helm/01-kafka-values.yaml -n banking-app

# keeping this to a single broker for now, this is not meant to be a production grade cluster yet
replicaCount: 1

# tuning the jvm heap down since this is running on a small dev/test size node, not a beefy prod one
heapOpts: "-Xmx512m -Xms512m"

# extraEnvVars is how this chart lets me pass raw env vars straight into the kafka container
# without the chart needing its own dedicated value for every single setting kafka supports
# letting kafka auto create topics on first publish instead of pre declaring every topic by hand,
# fine for this stage of the project, would probably turn this off once things stabilize
extraEnvVars:
  - name:  KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE
    value: "true"

# plaintext listener since this is all internal cluster traffic behind the vpc, no tls needed here yet
listeners:
  client:
    containerPort: 9092
    protocol: PLAINTEXT

# persistence turns a plain pod volume into a real persistentvolumeclaim behind the scenes,
# so the broker's data survives a pod restart instead of vanishing with the old container
persistence:
  enabled: true
  size: 8Gi
  accessModes:
    - ReadWriteOnce

# still getting a feel for requests vs limits, requests is what kubernetes guarantees the pod
# when scheduling it onto a node, limits is the hard ceiling before it gets throttled or killed
resources:
  requests:
    cpu: 250m
    memory: 512Mi

  limits:
    cpu: 500m
    memory: 1024Mi

# this whole zookeeper block was a surprise at first, learned this particular chart version still
# relies on zookeeper instead of the newer kraft mode, so it needs its own little stateful piece
# running alongside kafka just to coordinate the broker, giving it a smaller footprint since it
# is not doing any of the real message work itself
zookeeper:
  enabled: true
  replicaCount: 1
  persistence:
    enabled: true
    size: 4Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi

    limits:
      cpu: 250m
      memory: 512Mi
