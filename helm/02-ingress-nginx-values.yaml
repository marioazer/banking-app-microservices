# values for the ingress-nginx chart, this is what actually terminates traffic coming into the cluster
# same idea as the kafka values file, this only overrides specific keys, the chart itself already
# has sane defaults for everything I am not touching here
# e.g. helm install ingress-nginx ingress-nginx/ingress-nginx -f helm/02-ingress-nginx-values.yaml -n banking-app
controller:
  name: controller
  replicaCount: 1

  # makes sure the ingress objects get their address populated once the load balancer is ready
  publishService:
    enabled: true

  # these annotations are what actually provision a real aws network load balancer instead of a
  # classic elb, internet facing since this is meant to accept real inbound traffic from outside the vpc
  # took a bit to realize these annotations are aws specific, a different cloud would need completely
  # different annotation keys here to get the same effect
  service:
    enabled: true
    type: LoadBalancer
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-type: "external"
      service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "instance"
      service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
      service.beta.kubernetes.io/aws-load-balancer-backend-protocol: "tcp"

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

  # metrics on but no servicemonitor yet, learned this needs the prometheus operator actually
  # installed in the cluster first before turning this on would do anything useful
  metrics:
    enabled: true
    serviceMonitor:
      enabled: false