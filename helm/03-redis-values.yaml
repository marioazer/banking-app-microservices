# still learning helm, this is the smallest of the three values files so a decent one to start with

# redis cache for notification-service (@Cacheable / @EnableCaching in ProfileServiceClient.java)
# install with a release named "redis" so the service DNS name is redis-master,
# matching REDIS_HOST in k8s/07-notification-service.yaml
# learned the hard way that the release name is not just a label, it actually becomes part of
# the generated service dns name, so it has to line up with whatever the app config expects
# e.g. helm install redis bitnami/redis -f helm/03-redis-values.yaml -n banking-app

# single master, no replicas or sentinel, this is just a cache not the system of record for anything
architecture: standalone

# no password since this only sits inside the cluster network, nothing external ever talks to it directly
auth:
  enabled: false

master:
  persistence:
    enabled: true
    size: 2Gi

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

# zero replicas on purpose, if this pod goes down the cache just gets rebuilt from source on next read,
# a nice reminder that a cache does not need the same high availability treatment as a real database
replica:
  replicaCount: 0
