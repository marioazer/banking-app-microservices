<app-nav />

<div class="page">
  <div class="tab-row">
    <app-button [variant]="activeTab() === 'internal' ? 'primary' : 'secondary'" (clicked)="selectTab('internal')">
      Internal Transfer
    </app-button>
    <app-button [variant]="activeTab() === 'external' ? 'primary' : 'secondary'" (clicked)="selectTab('external')">
      External Wire
    </app-button>
  </div>

  <div class="card">
    @if (activeTab() === 'internal') {
      <form class="stack" (submit)="submitInternal(); $event.preventDefault()">
        <div class="select-group">
          <label for="fromAccount">From Account</label>
          <select id="fromAccount" (change)="onFromAccountChange($any($event.target).value)">
            <option value="" selected>Select account</option>
            @for (acc of accounts(); track acc.accountId) {
              <option [value]="acc.accountId">{{ acc.accountType }} {{ acc.maskedAccountNumber }}</option>
            }
          </select>
        </div>
        <div class="select-group">
          <label for="toAccount">To Account</label>
          <select id="toAccount" (change)="onToAccountChange($any($event.target).value)">
            <option value="" selected>Select account</option>
            @for (acc of accounts(); track acc.accountId) {
              <option [value]="acc.accountId">{{ acc.accountType }} {{ acc.maskedAccountNumber }}</option>
            }
          </select>
        </div>
        <app-input
          id="amount"
          label="Amount"
          [ngModel]="amount()"
          (ngModelChange)="amount.set($event)"
          name="amount"
        />
        <app-alert-banner type="error" [message]="validationError()" />
        <app-alert-banner [type]="resultType()" [message]="resultMessage()" />
        <app-button type="submit">Send</app-button>
      </form>
    } @else {
      <form class="stack" (submit)="submitExternal(); $event.preventDefault()">
        <div class="select-group">
          <label for="extFromAccount">From Account</label>
          <select id="extFromAccount" (change)="onExtFromAccountChange($any($event.target).value)">
            <option value="" selected>Select account</option>
            @for (acc of accounts(); track acc.accountId) {
              <option [value]="acc.accountId">{{ acc.accountType }} {{ acc.maskedAccountNumber }}</option>
            }
          </select>
        </div>
        <app-input
          id="beneficiaryName"
          label="Beneficiary Name"
          [ngModel]="beneficiaryName()"
          (ngModelChange)="beneficiaryName.set($event)"
          name="beneficiaryName"
        />
        <app-input
          id="iban"
          label="IBAN"
          [ngModel]="iban()"
          (ngModelChange)="iban.set($event)"
          name="iban"
        />
        <app-input
          id="swiftCode"
          label="SWIFT Code"
          [ngModel]="swiftCode()"
          (ngModelChange)="swiftCode.set($event)"
          name="swiftCode"
        />
        <app-input
          id="extAmount"
          label="Amount"
          [ngModel]="extAmount()"
          (ngModelChange)="extAmount.set($event)"
          name="amount"
        />
        <app-alert-banner type="error" [message]="validationError()" />
        <app-alert-banner [type]="resultType()" [message]="resultMessage()" />
        <app-button type="submit">Send</app-button>
      </form>
    }
  </div>
</div>
