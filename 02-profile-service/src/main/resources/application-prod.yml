# prod profile, same env var driven pattern as the other services, all values come from the
# k8s configmap and secret rather than being written directly in this file
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

# this is the hmac secret KycWebhookFilter uses to verify a webhook actually came from the real kyc vendor
kyc:
  vendor:
    webhook:
      secret: ${KYC_WEBHOOK_SECRET}

# jwt signing key this service verifies incoming access tokens against, comes from the same
# k8s secret auth-service uses to sign them
application:
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY}

server:
  port: 8080

app:
  demo:
    enabled: false
