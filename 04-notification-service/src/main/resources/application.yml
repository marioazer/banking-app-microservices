# local dev profile, points at the docker-compose postgres, kafka and redis all running on localhost
spring:
  application:
    name: 04-notification-service
  datasource:
    url: jdbc:postgresql://localhost:5432/banking
    username: dbadmin
    password: localdevpassword
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  # the only service with a redis block, backs whatever caching ProfileServiceClient does with @cacheable
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

# real SMS delivery for 2FA codes via Textbelt (https://textbelt.com) - disabled by default so
# local dev never needs this (LoggingSmsProviderClient handles that case). Set SMS_ENABLED=true
# in your own shell to actually send texts. The free "textbelt" key needs no signup/account at
# all (1 text/day/IP) - only override sms.textbelt-key if you buy a paid key later.
sms:
  enabled: ${SMS_ENABLED:false}
  textbelt-key: ${TEXTBELT_KEY:textbelt}

server:
  port: 8085
