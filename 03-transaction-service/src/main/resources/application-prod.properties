# prod profile, db and kafka come from env vars injected by k8s like all the other services
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

# this is how ProfileServiceClient/KycEnforcementAspect reach the profile service to check kyc status,
# defaults to the in cluster k8s service dns name so this works without extra config once deployed
application.client.profile-service.url=${PROFILE_SERVICE_URL:http://profile-service:8080}

# account-service is the sole owner of the accounts/transactions tables in the cluster too
application.client.account-service.url=${ACCOUNT_SERVICE_URL:http://account-service:8080}

# jwt signing key this service verifies incoming access tokens against, comes from the same
# k8s secret auth-service uses to sign them
application.security.jwt.secret-key=${JWT_SECRET_KEY}

server.port=8080
