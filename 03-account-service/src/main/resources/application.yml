# local dev profile, same shared docker-compose postgres as the rest of the services
# no kafka block here since account-service does not publish or consume any events, it only
# serves the dashboard and transaction history reads
spring:
  application:
    name: 03-account-service
  datasource:
    url: jdbc:postgresql://localhost:5432/banking
    username: dbadmin
    password: localdevpassword
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  port: 8083
