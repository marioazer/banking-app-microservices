# prod profile, db credentials come from the k8s secret, same as every other service
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

# jwt signing key this service verifies incoming access tokens against, comes from the same
# k8s secret auth-service uses to sign them
application:
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY}

server:
  port: 8080
  error:
    include-message: always

app:
  demo:
    enabled: false
