# this is the one object that actually routes outside traffic to the right internal service
# based on the url path, everything else in k8s/ so far has just been clusterip services
# that only talk to each other inside the cluster
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: banking-ingress
  namespace: banking-app
  # this annotation is what tells the cluster which ingress controller should actually
  # handle these rules, has to match whatever controller is installed, nginx here
  annotations:
    kubernetes.io/ingress.class: "nginx"

spec:
  rules:
    - http:
        paths:
          # pathType prefix means /api/v1/auth also matches things like /api/v1/auth/login,
          # not just an exact match on the literal path string
          # 1. Auth traffic (login/2FA/refresh/logout - see AuthController)
          - path: /api/v1/auth
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  number: 8080

          # 2. Account Traffic
          - path: /api/v1/accounts
            pathType: Prefix
            backend:
              service:
                name: account-service
                port:
                  number: 8080

          # 3. Transaction Traffic
          - path: /api/v1/transactions
            pathType: Prefix
            backend:
              service:
                name: transaction-service
                port:
                  number: 8080

          # 4. Transfer Traffic (TransferController lives inside transaction-service,
          # there is no separate transfer-service deployment)
          - path: /api/v1/transfers
            pathType: Prefix
            backend:
              service:
                name: transaction-service
                port:
                  number: 8080

          # 5. Profile Traffic (ProfileController / PreferenceController)
          - path: /api/v1/profiles
            pathType: Prefix
            backend:
              service:
                name: profile-service
                port:
                  number: 8080
