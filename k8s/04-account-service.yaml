# account service deployment, this is the workload that serves the dashboard and transaction history apis
apiVersion: apps/v1
kind: Deployment
metadata:
  name: account-service
  namespace: banking-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: account-service
  template:
    metadata:
      labels:
        app: account-service
    spec:
      containers:
        - name: account-service
          image: your-docker-registry/account-service:latest
          ports:
            - containerPort: 8080
          # pulls in the shared config values plus the db username and password from the secret
          # envFrom loads every key from these as env vars, saves listing each one by hand under env
          envFrom:
            - configMapRef:
                name: banking-global-config
            - secretRef:
                name: banking-db-secret
---
# internal only service, clusterip since nothing outside the cluster talks to this directly,
# all external traffic comes in through the ingress instead
# clusterip is actually the default service type, only picked it explicitly here for clarity
apiVersion: v1
kind: Service
metadata:
  name: account-service
  namespace: banking-app
spec:
  type: ClusterIP
  selector:
    app: account-service
  ports:
    - port: 8080
      targetPort: 8080