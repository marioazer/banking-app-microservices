# these are placeholder dev values just to get the whole stack running end to end
# in a real deployment these would come from something like aws secrets manager or vault,
# not sit in a yaml file that gets checked into git
# type: Opaque just means a generic secret with no special structure, kubernetes also has
# built in types for things like docker registry creds or tls certs that expect specific keys,
# this is just a plain bag of key value pairs
apiVersion: v1
kind: Secret
metadata:
  name: banking-db-secret
  namespace: banking-app
type: Opaque
data:
  # k8s secrets have to be base64 encoded, not encrypted, this is just an encoding not real protection
  DB_USERNAME: ZGJhZG1pbg==
  DB_PASSWORD: eW91ci1zZWN1cmUtcGFzc3dvcmQ=
  # signing key the auth service uses for jwts, shared across services so they can all validate tokens
  JWT_SECRET_KEY: ZjcwNGRjNjRhOTlkNjFhY2JhOGY3OWE1M2QzY2IyNmU3OTAzZThhZTdhYWU4YjFhODQyMWE2YTdkNTM2Mzk3ZQ==
  # matches the secret the profile service uses to verify the kyc vendor's hmac signature on webhooks
  KYC_WEBHOOK_SECRET: Zjg4YTBlMzZmZjdiOTdlMGExZTgyNzExMGE3OTFlYTE5MjMyNjcyMDY0YmUxYjdhY2IxMTY5M2FkOTg5YWM2Mg==
